name: Build Windows

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Check Clippy
        run: cargo clippy --all-targets --target ${{ matrix.target }} --locked -- -D warnings
      - name: Test
        run: cargo test --target ${{ matrix.target }} --locked
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist -Force | Out-Null
          Copy-Item target/${{ matrix.target }}/release/uphide.exe dist/uphide-${{ matrix.arch }}.exe
      - uses: actions/upload-artifact@v6
        with:
          name: uphide-${{ matrix.arch }}
          path: dist/*.exe
          if-no-files-found: error

  msrv:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Test with the minimum Rust version
        run: cargo test --locked
      - name: Build with the minimum Rust version
        run: cargo build --release --locked

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, msrv]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: uphide-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.exe --verify-tag --title "Uphide ${RELEASE_TAG#v}" --generate-notes
